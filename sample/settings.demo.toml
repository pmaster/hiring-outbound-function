# Demo settings. Everything here is fake but valid, so the pipeline runs end
# to end with no API keys and no network:
#
#     python3 -m outbound demo
#
# Do not send from this file. The identity block is invented.

[identity]
sending_domain  = "hiring.example"
from_name       = "Peter"
from_email      = "peter@hiring.example"
reply_to        = "peter@hiring.example"
postal_address  = "1 Example Street, Suite 200, Austin, TX 78701, USA"
careers_page    = "https://hiring.example/careers"
unsubscribe_url = "https://hiring.example/unsubscribe?e={email_token}"

[sending]
per_mailbox_per_day = 18
mailboxes           = 2
step_gap_days       = [0, 4, 8]
max_steps           = 0
search_closes_days  = 10
skip_weekdays       = [5, 6]
send_window         = ["08:30", "16:30"]
timezone            = "America/New_York"
stop_on             = ["replied", "booked", "unsubscribed", "bounced"]

[warmup]
require_warmup_done = false
ramp = []

[booking]
screener_url      = "https://cal.example/peter/screener-10min"
screener_minutes  = 10
cancel_lead_hours = 12
recheck_min_score = 0.55

[compliance]
allow_countries   = ["US"]
block_countries   = ["CA", "PL", "DE", "FR", "ES", "IT", "NL", "IE", "PT", "GB"]
enforce_geo_block = true
require_unsubscribe = true
require_postal      = true

[scoring]
auto_reject_below   = 0.45
auto_approve_above  = 0.80
require_hand_review = true

[evaluation]
# The AI screen. It runs after scoring, judges each profile against the role,
# and drafts the personal note the first email needs. "dryrun" reuses the
# heuristic score offline; "anthropic" calls a model (needs ANTHROPIC_API_KEY).
provider = "dryrun"        # dryrun | anthropic | none
# assist: draft the note and the verdict, but a person still approves. This is
#         the founder-review flow, sped up.
# auto:   approve a strong fit with its note, reject a weak one, send a maybe to
#         review. This is the volume flow: the list moves with no hand notes.
mode = "assist"            # assist | auto
stages = ["review"]        # which pile the screen reads
auto_approve_at = 0.75     # in auto mode, a strong fit at or above this approves
auto_reject_below = 0.40   # in auto mode, fit below this rejects
model = "claude-sonnet-5"  # anthropic only
max_tokens = 700           # anthropic only

[providers]
search  = "dryrun"
enrich  = "dryrun"
verify  = "dryrun"
send    = "dryrun"
booking = "dryrun"
# Where replies and bounces are read from. "imap" reads the sending mailbox,
# which is right when the mailboxes are yours. Point it at the sequencer when
# one owns the sending, because that is where the replies land.
replies = "imap"        # imap | instantly
enrich_waterfall = []

[limits]
max_profiles_per_search = 1000
max_enrich_per_run      = 250
max_sends_per_run       = 60
# Never write to the same person for two different seats. A person who gets
# two of our emails can see it was a mass mailing.
one_role_per_person       = true
never_enrich_rejected   = true
# Stop sending if the bounce rate over the recent window goes above this.
# Above about 3 percent damages a domain that has no reputation to spend.
max_bounce_rate         = 0.03
bounce_rate_window      = 200
bounce_rate_min_sends   = 40
enrich_attempts         = 2

[storage]
db_path    = "data/demo/outbound.db"
outbox_dir = "data/demo/outbox"
export_dir = "data/demo/exports"

# Only the job description URLs are overridden here, so the demo does not link
# at the real careers site. Comp lives in the role files now and docs/COMP.md
# says where each band came from.
[role_overrides.head-of-operations]
jd_url = "https://hiring.example/roles/head-of-operations"

[role_overrides.engineer]
jd_url = "https://hiring.example/roles/engineer"

[role_overrides.ops-generalist]
jd_url = "https://hiring.example/roles/operations"

[role_overrides.controller]
jd_url = "https://hiring.example/roles/controller"

[role_overrides.brand-and-funnel]
jd_url = "https://hiring.example/roles/brand-and-funnel"

[role_overrides.chief-of-staff]
jd_url = "https://hiring.example/roles/chief-of-staff"

[role_overrides.quant-program-manager]
