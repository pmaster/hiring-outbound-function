# Outbound recruiting - global settings.
#
# Copy to config/settings.toml and edit. Never commit config/settings.toml.
# Secrets do NOT go here. Put secrets in .env (see .env.example).

[identity]
# DECIDED by Peter, 2026-08-30: outbound sends from viewlineventures.com.
#
# That domain is designated for full-time hiring in Peter's scoping doc and it
# already carries job posting notifications. The outbound SOP argued against
# it, because a complaint cluster on a domain that also carries normal business
# email takes the business email down with it. Peter has weighed that and
# chosen. Setting `sending_domain_decided_on` records the decision and stops
# `outbound doctor` asking again.
#
# What still follows from the SOP's argument, and is worth doing:
#   - Send from a dedicated mailbox, not from a mailbox anyone relies on.
#   - Keep the volume low. The caps below are already low.
#   - Watch the DMARC reports. `outbound dns` checks the records are right.
sending_domain    = "viewlineventures.com"
sending_domain_decided_on = "2026-08-30"
from_name         = "Peter"
from_email        = "peterm@viewlineventures.com"
reply_to          = "peterm@viewlineventures.com"
# CAN-SPAM requires a real physical postal address in every commercial email.
# This is the ONE field that cannot be guessed. Put the registered address of
# the entity that is doing the hiring. `outbound doctor` blocks until it is set.
postal_address    = "CHANGEME Street, CHANGEME City, ST 00000, USA"
careers_page      = "https://viewlineventures.com/careers"
unsubscribe_url   = "https://viewlineventures.com/unsubscribe?e={email_token}"

[sending]
# Emails per mailbox per working day. Keep low. 15-20 is the founder-send
# shape from the SOP; 40 is the ceiling for a warmed mailbox.
per_mailbox_per_day = 18
mailboxes           = 2
# Days between sequence steps.
step_gap_days       = [0, 4, 8]
# The last email names a date. This is how many days ahead it lands.
search_closes_days  = 10
# Do not send on these weekdays (0 = Monday).
skip_weekdays       = [5, 6]
# Local send window, 24h clock, in the sender's timezone.
send_window         = ["08:30", "16:30"]
timezone            = "America/New_York"
# Stop the whole sequence for a person once any of these happen.
stop_on             = ["replied", "booked", "unsubscribed", "bounced"]

[warmup]
# Refuse to send until a mailbox has completed warm up. Nothing here can
# measure that, so it is an attestation: `outbound doctor` keeps reminding you
# until you send with --attest-warmup. Ten days at this volume. See docs/SETUP.md.
require_warmup_done   = true
# The ramp, as [days at this level, emails per day]. Counted in days the
# domain actually sent on, so a weekend does not fast forward it. Empty list
# means no ramp. A new domain that sends full volume on day one gets filtered,
# and the filtering is silent.
ramp = [[3, 5], [3, 10], [4, 14], [0, 0]]

[booking]
# The 10 minute screener. Create it, then paste the link here.
screener_url        = "https://cal.com/CHANGEME/screener-10min"
screener_minutes    = 10
# Cancel a booking no later than this many hours before it starts.
cancel_lead_hours   = 12
# Re-score a booker against the role ICP before the call. Below this, cancel.
recheck_min_score   = 0.55

[compliance]
# Countries we will cold email. US only by default.
# CASL (Canada) requires consent. GDPR plus the Polish electronic services
# act make EU cold email to individuals a bad idea. See docs/COMPLIANCE.md.
allow_countries     = ["US"]
block_countries     = ["CA", "PL", "DE", "FR", "ES", "IT", "NL", "IE", "PT", "SE", "DK", "FI", "NO", "AT", "BE", "CZ", "GR", "HU", "RO", "SK", "SI", "BG", "HR", "EE", "LV", "LT", "LU", "MT", "CY", "GB"]
# Hard block. The pipeline refuses to queue a person in a blocked country
# even if a role config allows it.
enforce_geo_block   = true
require_unsubscribe = true
require_postal      = true

[scoring]
# A candidate below this is auto-rejected and never enriched.
auto_reject_below   = 0.45
# A candidate at or above this skips the hand review queue.
auto_approve_above  = 0.80
# Every candidate between the two goes to `outbound review`.
# Hand review is the edge. Do not turn this off.
require_hand_review = true

[providers]
# Which adapter to use for each stage. "dryrun" works with no API key and
# no network, and is the default so the pipeline runs out of the box.
search  = "dryrun"     # dryrun | apify | apollo | manual
enrich  = "dryrun"     # dryrun | apollo | rocketreach | findymail | prospeo | dropcontact
verify  = "dryrun"     # dryrun | millionverifier | neverbounce | zerobounce | none
send    = "dryrun"     # dryrun | instantly | smartlead | smtp
booking = "dryrun"     # dryrun | calcom | calendly | manual
# Where replies and bounces are read from. "imap" reads the sending mailbox,
# which is right when the mailboxes are yours. Point it at the sequencer when
# one owns the sending, because that is where the replies land.
replies = "imap"       # imap | instantly

# Enrichment waterfall. Tried in order until one returns an address.
# Overrides `providers.enrich` when non-empty.
enrich_waterfall = []

[limits]
# Stop a run rather than burn credits on a misconfigured search.
max_profiles_per_search   = 1000
max_enrich_per_run        = 250
max_sends_per_run         = 60
# Refuse to enrich a candidate scored below auto_reject_below. Belt and braces.
# Never write to the same person for two different seats. A person who gets
# two of our emails can see it was a mass mailing.
one_role_per_person       = true
never_enrich_rejected     = true
# Ask the enrichment waterfall this many times before giving up on a person.
# Stop sending if the bounce rate over the recent window goes above this.
# Above about 3 percent damages a domain that has no reputation to spend.
max_bounce_rate         = 0.03
bounce_rate_window      = 200
bounce_rate_min_sends   = 40
enrich_attempts           = 2

[storage]
db_path    = "data/outbound.db"
outbox_dir = "data/outbox"
export_dir = "data/exports"
