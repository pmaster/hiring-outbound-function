# Quantitative Team Manager. DRAFT.
#
# Runs the execution floor day to day so the Head of Quant can go back to
# research. Today he does both, so the research half is not happening and the
# floor half is not managed as well as it should be.
#
# Peter singled this seat out as the one that most needs a wide title
# portfolio: the range of career backgrounds that fit is unusually broad, and
# almost none of them search for "Quantitative Team Manager". The [icp] titles
# list below is deliberately long for that reason. The POSTED titles are a
# different and much shorter list, in
# brain:projects/sunbird/hiring/common/title-portfolio.md.
#
# NOT "Quantitative PM". PM reads as product manager to half the pool and
# project manager to the other half, and the job is neither.
#
# status = "draft" because the location rule is unsettled. The August JD says
# hybrid in New Jersey and Michigan; hiring-pack.md says the floor is North
# America with Alberta and Ontario the priority gap. That changes the geo
# filter, so settle it before sending.

[role]
key            = "quant-team-manager"
title          = "Quantitative Team Manager"
status         = "draft"
seats          = 1
seniority      = "senior"
employment     = "full time, hybrid"
# Hiring Sprint Q1, "Quant PM / Technical PM", Mar 2026, Philadelphia
# anchored. See docs/COMP.md.
comp           = "$90,000 to $125,000 a year plus performance bonuses"
comp_in_email  = true
jd_url         = "https://CHANGEME.example/roles/quant-team-manager"
one_liner      = "Run an execution floor where accuracy matters as much as speed."
sender         = "peter"
template_dir   = "quant-team-manager"
daily_cap      = 15
target_list_size = 300

[icp]
# Long on purpose. Five distinct populations fit this seat and they use
# different words for the same job.
titles = [
  # Trading and exchange operations
  "Trading Operations Manager", "Head of Trading Operations",
  "Trade Support Manager", "Middle Office Manager", "Operations Manager, Trading",
  # High volume execution and fulfilment
  "Execution Operations Manager", "Fulfillment Operations Manager",
  "Production Manager", "Operations Supervisor", "Floor Manager",
  # Gaming and betting operations
  "Gaming Operations Manager", "Casino Operations Manager",
  "Sportsbook Operations Manager", "iGaming Operations Manager",
  # Technical program management
  "Technical Program Manager", "Technical Project Manager",
  "Operations Program Manager", "Quant Operations Manager",
  # Quality and accuracy led operations
  "Quality Assurance Manager", "Process Improvement Manager",
]
title_excludes = [
  "Intern", "Recruiter", "Sales", "Account Executive", "Warehouse",
  "Restaurant", "Retail Store", "Nurse", "Clinical", "Driver",
  "Quantitative Researcher", "Quantitative Analyst",
]
seniority              = ["manager", "senior", "lead", "director"]
company_headcount      = [30, 2000]
geo                    = ["United States"]
geo_exclude            = ["Canada", "European Union", "Poland"]
min_years_experience   = 5
min_months_in_role     = 18
max_jobs_last_3_years  = 3
min_longest_tenure_years = 3

keywords_any = [
  "error rate", "throughput", "SOP", "standard operating procedure",
  "ramp time", "output per", "quality assurance", "playbook",
  "shift", "floor", "execution", "settlement", "reconciliation",
]

[[signal]]
key    = "title_match"
weight = 0.18
kind   = "any_of"
field  = "title"
values = [
  "trading operations", "execution operations", "fulfillment operations",
  "gaming operations", "casino operations", "sportsbook operations",
  "technical program manager", "technical project manager",
  "operations program manager", "quant operations", "middle office",
  "production manager", "floor manager", "operations supervisor",
]

[[signal]]
key      = "managed_a_floor"
weight   = 0.22
kind     = "regex_any"
field    = "profile_text"
patterns = [
  "managed a team of", "team of \\d+", "direct reports", "floor of",
  "shift", "supervised", "led a team",
]
# The seat manages about fifteen people at target. Someone who has never
# managed is a no, however good the process thinking is.

[[signal]]
key      = "accuracy_and_error_rates"
weight   = 0.22
kind     = "regex_any"
field    = "profile_text"
patterns = [
  "error rate", "defect", "accuracy", "quality assurance", "\\bQA\\b",
  "six sigma", "root cause", "corrective action", "audit trail",
]
# The first competency. A mistake is a failure of the system before it is a
# failure of the person, and that belief shows up in a profile.

[[signal]]
key      = "wrote_requirements_for_engineers"
weight   = 0.14
kind     = "regex_any"
field    = "profile_text"
patterns = [
  "requirements", "specification", "worked with engineering",
  "product requirements", "PRD", "automation", "tooling", "internal tools",
]
# The seat is the bridge to engineering. A manager who cannot write a
# specification an engineer can build from leaves the automation undone.

[[signal]]
key      = "trained_early_career_people"
weight   = 0.10
kind     = "regex_any"
field    = "profile_text"
patterns = [
  "onboarding", "training", "ramp", "coached", "mentored", "curriculum",
  "new hire",
]
# Ramp time is currently measured in months and the floor is largely early
# career. Systematising training is an explicit outcome.

[[signal]]
key      = "competitive_or_strategic_background"
weight   = 0.06
kind     = "regex_any"
field    = "profile_text"
patterns = [
  "poker", "chess", "esports", "competitive gaming", "trading",
  "sports betting", "advantage play",
]
# Genuine domain interest is one of the strongest predictors of
# discretionary effort in our own hiring record. Bonus, never a gate.

[[signal]]
key      = "tenure_depth"
weight   = 0.08
kind     = "min_value"
field    = "longest_tenure_years"
min      = 3.0
soft_min = 1.5

[[signal]]
key      = "not_a_job_hopper"
weight   = 0.06
kind     = "max_value"
field    = "jobs_last_3_years"
max      = 3
soft_max = 5

[[signal]]
key      = "quant_research_not_ops"
weight   = -0.14
kind     = "regex_any"
field    = "profile_text"
patterns = [
  "alpha research", "signal research", "backtest", "PhD in",
  "stochastic calculus", "derivatives pricing",
]
# This is not a mathematics job and the JD says so. A researcher who takes it
# leaves in month three. Hand review, not an automatic reject.

[[disqualifier]]
key    = "no_linkedin"
kind   = "missing"
field  = "linkedin_url"
reason = "No profile to hand check."

[[disqualifier]]
key    = "blocked_geo"
kind   = "country_blocked"
field  = "country"
reason = "Cold email is not lawful or not advisable in this country."

[[disqualifier]]
key    = "suppressed"
kind   = "suppressed"
field  = "linkedin_url"
reason = "On the suppression list."

[booking]
# The location question is first because it is the hard gate.
questions = [
  "Are you within commuting distance of northern New Jersey or the Detroit metro, or willing to be?",
  "How many people have you managed directly, and what were they measured on?",
  "Tell me about a time you cut an error rate. What was it before, what was it after, and what did you change?",
  "What is your target compensation, and when could you start?",
]

[[search]]
name      = "trading-and-execution-ops"
titles    = ["Trading Operations Manager", "Trade Support Manager", "Middle Office Manager", "Execution Operations Manager"]
geo       = ["New Jersey", "New York", "Pennsylvania", "Michigan"]
headcount = ["51-200", "201-500", "501-1000"]
seniority = ["Manager", "Senior", "Director"]
keywords  = "(\"error rate\" OR accuracy OR reconciliation OR settlement) AND (managed OR led)"
target    = 120

[[search]]
name      = "gaming-and-betting-ops"
titles    = ["Gaming Operations Manager", "Casino Operations Manager", "Sportsbook Operations Manager"]
geo       = ["New Jersey", "Michigan", "Pennsylvania", "Nevada"]
seniority = ["Manager", "Senior", "Director"]
keywords  = "(operations OR floor OR compliance) AND (manager OR supervisor)"
target    = 90

[[search]]
name      = "high-volume-fulfilment-floor"
titles    = ["Production Manager", "Fulfillment Operations Manager", "Operations Supervisor", "Floor Manager"]
geo       = ["New Jersey", "Michigan", "Pennsylvania"]
headcount = ["51-200", "201-500"]
seniority = ["Manager", "Senior"]
keywords  = "(throughput OR \"output per\" OR SOP OR \"quality\") AND (team OR shift)"
target    = 90
